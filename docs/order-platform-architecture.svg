<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc">
  <title id="title">Order Platform: сервисы заказов, склада и оплаты</title>
  <desc id="desc">Клиент вызывает REST API трёх сервисов: заказов, склада и оплаты. Order получает снимки товаров по gRPC из Inventory. Каждый сервис владеет отдельной PostgreSQL с inbox и outbox. События резервирования, оплаты и компенсаций передаются через Kafka с ключом orderId.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 700; }
      .name { font-size: 25px; font-weight: 650; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #475569; }
      .muted { font-size: 15px; fill: #64748b; }
      .db { font-size: 22px; font-weight: 600; }
      .topic { font-family: Consolas, monospace; font-size: 20px; }
      .sql { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow-gray); }
      .publish { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .consume { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-violet); }
    </style>
  </defs>
  <rect width="1400" height="870" rx="24" fill="#f8fafc"/>
  <text class="title" x="60" y="48">Order Platform</text>
  <text class="small" x="1340" y="46" text-anchor="end">3 сервиса · 3 базы данных · Kafka</text>

  <rect x="530" y="77" width="340" height="74" rx="16" fill="#0f172a"/>
  <text x="700" y="109" text-anchor="middle" style="font-size:22px;font-weight:600;fill:#fff">Клиент / Swagger</text>
  <text x="700" y="135" text-anchor="middle" style="font-size:16px;fill:#cbd5e1">REST API</text>
  <path class="sql" d="M700 151V180H230V220"/>
  <path class="sql" d="M700 180V220"/>
  <path class="sql" d="M700 180H1170V220"/>

  <rect x="60" y="220" width="340" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="name" x="84" y="259" style="fill:#1d4ed8">order-service</text>
  <rect x="320" y="235" width="60" height="30" rx="9" fill="#eff6ff"/>
  <text x="350" y="256" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#1d4ed8">8081</text>
  <text class="body" x="84" y="295">Заказы и история статусов</text>
  <text class="small" x="84" y="324">Создание · отмена · результат оплаты</text>
  <rect x="84" y="350" width="92" height="30" rx="8" fill="#eff6ff"/>
  <rect x="188" y="350" width="100" height="30" rx="8" fill="#eff6ff"/>
  <text x="130" y="371" text-anchor="middle" style="font-size:16px;fill:#1d4ed8">Inbox</text>
  <text x="238" y="371" text-anchor="middle" style="font-size:16px;fill:#1d4ed8">Outbox</text>
  <text class="muted" x="84" y="399">Локальная транзакция</text>

  <path class="sql" d="M230 410V470"/>
  <text class="muted" x="244" y="449">SQL</text>
  <rect x="60" y="470" width="340" height="100" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="db" x="84" y="501">order_db</text>
  <text class="small" x="84" y="528" style="font-size:15px">orders · status history · payment results</text>
  <text class="small" x="84" y="551">inbox · outbox</text>
  <path class="publish" d="M230 570V670"/>
  <text class="small" x="244" y="623">outbox</text>

  <rect x="530" y="220" width="340" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="name" x="554" y="259" style="fill:#047857">inventory-service</text>
  <rect x="790" y="235" width="60" height="30" rx="9" fill="#ecfdf5"/>
  <text x="820" y="256" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#047857">8082</text>
  <text class="body" x="554" y="295">Товары, остатки и резервы</text>
  <text class="small" x="554" y="324">Резервирование · списание · отмена</text>
  <rect x="554" y="350" width="92" height="30" rx="8" fill="#ecfdf5"/>
  <rect x="658" y="350" width="100" height="30" rx="8" fill="#ecfdf5"/>
  <text x="600" y="371" text-anchor="middle" style="font-size:16px;fill:#047857">Inbox</text>
  <text x="708" y="371" text-anchor="middle" style="font-size:16px;fill:#047857">Outbox</text>
  <text class="muted" x="554" y="399">Локальная транзакция</text>

  <path class="sql" d="M700 410V470"/>
  <text class="muted" x="714" y="449">SQL</text>
  <rect x="530" y="470" width="340" height="100" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="db" x="554" y="501">inventory_db</text>
  <text class="small" x="554" y="528" style="font-size:15px">products · stock · reservations</text>
  <text class="small" x="554" y="551">inbox · outbox</text>
  <path class="publish" d="M700 570V670"/>
  <text class="small" x="714" y="623">outbox</text>

  <rect x="1000" y="220" width="340" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="name" x="1024" y="259" style="fill:#a16207">payment-service</text>
  <rect x="1260" y="235" width="60" height="30" rx="9" fill="#fffbeb"/>
  <text x="1290" y="256" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#a16207">8083</text>
  <text class="body" x="1024" y="295">Платежи и mock-возвраты</text>
  <text class="small" x="1024" y="324">Подтверждение · отказ · таймаут</text>
  <rect x="1024" y="350" width="92" height="30" rx="8" fill="#fffbeb"/>
  <rect x="1128" y="350" width="100" height="30" rx="8" fill="#fffbeb"/>
  <text x="1070" y="371" text-anchor="middle" style="font-size:16px;fill:#a16207">Inbox</text>
  <text x="1178" y="371" text-anchor="middle" style="font-size:16px;fill:#a16207">Outbox</text>
  <text class="muted" x="1024" y="399">Локальная транзакция</text>

  <path class="sql" d="M1170 410V470"/>
  <text class="muted" x="1184" y="449">SQL</text>
  <rect x="1000" y="470" width="340" height="100" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="db" x="1024" y="501">payment_db</text>
  <text class="small" x="1024" y="528" style="font-size:15px">payments · refunds</text>
  <text class="small" x="1024" y="551">inbox · outbox</text>
  <path class="publish" d="M1170 570V670"/>
  <text class="small" x="1184" y="623">outbox</text>

  <path class="sql" d="M400 310H530"/>
  <text class="small" x="465" y="294" text-anchor="middle" style="font-weight:600">gRPC</text>
  <text class="muted" x="465" y="336" text-anchor="middle">снимки</text>

  <rect x="60" y="670" width="1280" height="130" rx="20" fill="#e8edf7" stroke="#c7d2e5" stroke-width="1.5"/>
  <text class="title" x="88" y="708">Apache Kafka</text>
  <text class="small" x="1312" y="706" text-anchor="end">Ключ сообщений — orderId · отдельные consumer groups</text>
  <rect x="88" y="730" width="388" height="44" rx="10" fill="#fff"/>
  <rect x="506" y="730" width="388" height="44" rx="10" fill="#fff"/>
  <rect x="924" y="730" width="388" height="44" rx="10" fill="#fff"/>
  <text class="topic" x="282" y="759" text-anchor="middle">order.events</text>
  <text class="topic" x="700" y="759" text-anchor="middle">inventory.events</text>
  <text class="topic" x="1118" y="759" text-anchor="middle">payment.events</text>

  <path class="consume" d="M455 670V440H380V410"/>
  <path class="consume" d="M925 670V440H850V410"/>
  <path class="consume" d="M1340 735H1370V440H1320V410"/>

  <path class="publish" d="M80 836H124"/>
  <text class="small" x="140" y="842">Публикация через outbox</text>
  <path class="consume" d="M610 836H654"/>
  <text class="small" x="670" y="842">Потребление событий</text>
  <text class="muted" x="1340" y="842" text-anchor="end">Retry + DLT</text>
</svg>
