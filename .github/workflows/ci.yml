name: Order Platform CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # Java build + tests
  # =========================

  build-and-test:
    name: Build and test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          # - notification-service
          # - api-gateway

    defaults:
      run:
        shell: bash

        working-directory: ${{ matrix.service }}

    env:
      JAVA_VERSION: '21'
      SPRING_PROFILES_ACTIVE: test

      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.console=plain

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Show Java version
        run: java -version

      - name: Build and run tests
        working-directory: .
        run: |
          chmod +x ./gradlew
          ./gradlew :${{matrix.service}}:build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: ${{ failure() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            ${{ matrix.service }}/build/reports/tests/
            ${{ matrix.service }}/build/test-results/
          if-no-files-found: ignore
          retention-days: 7


  # =========================
  # Docker + Compose
  # =========================

  docker-integration:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORDER_DB_NAME: order_db
      ORDER_DB_USERNAME: order_user
      ORDER_DB_PASSWORD: order_password
      ORDER_DB_PORT: 5433

      INVENTORY_DB_NAME: inventory_db
      INVENTORY_DB_USERNAME: inventory_user
      INVENTORY_DB_PASSWORD: inventory_password
      INVENTORY_DB_PORT: 5434

      PAYMENT_DB_NAME: payment_db
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: payment_password
      PAYMENT_DB_PORT: 5435

      ORDER_SERVICE_PORT: 8081
      INVENTORY_SERVICE_PORT: 8082
      PAYMENT_SERVICE_PORT: 8083

      KAFKA_EXTERNAL_PORT: 9092
      KAFKA_UI_PORT: 8080

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Gradle directories used by Docker
        id: docker-gradle-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/buildkit-gradle
          key: ${{ runner.os }}-${{ runner.arch }}-docker-gradle-v1-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle.properties', '**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-docker-gradle-v1-

      - name: Restore and extract Gradle cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          utility-image: busybox:1.37.0
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-gradle/order-service": {
                "id": "order-service-gradle", "target": "/root/.gradle", "sharing": "locked"
              },
              "${{ runner.temp }}/buildkit-gradle/inventory-service": {
                "id": "inventory-service-gradle", "target": "/root/.gradle", "sharing": "locked"
              },
              "${{ runner.temp }}/buildkit-gradle/payment-service": {
                "id": "payment-service-gradle", "target": "/root/.gradle", "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.docker-gradle-cache.outputs.cache-hit }}

      - name: Validate Compose configuration
        run: make config

      - name: Build and start stack
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: make ci-up-build

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: make down

